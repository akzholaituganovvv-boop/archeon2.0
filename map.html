<title>ARCHEON — Интерактивті карта</title>

<style>
:root {
    --archeon-bg: #11110e;
    --archeon-panel: #1c1a15;
    --archeon-panel-light: #252219;
    --archeon-gold: #e9bd68;
    --archeon-gold-dark: #765b2d;
    --archeon-text: #eee5d3;
    --archeon-muted: #c6c0b4;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--archeon-bg);
    color: var(--archeon-text);
}

.top-line {
    height: 3px;
    background: var(--archeon-gold-dark);
}

.header {
    min-height: 72px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    border-bottom: 1px solid var(--archeon-gold-dark);
    background: #11110e;
}

.logo {
    color: var(--archeon-gold);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 2px;
}

.logo span {
    color: #b78a43;
}

.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 18px;
    border-radius: 7px;
    background: var(--archeon-gold);
    color: #17140e;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    transition: background .2s ease, transform .2s ease;
}

.back:hover {
    background: #f2d18a;
    transform: translateY(-1px);
}

.page {
    width: min(1400px, 88%);
    margin: 0 auto;
    padding: 42px 0 55px;
}

.title-row {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 24px;
}

.eyebrow {
    color: var(--archeon-gold);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

h1 {
    color: var(--archeon-gold);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 4vw, 48px);
    line-height: 1.12;
    margin: 0;
    letter-spacing: -1px;
}

.subtitle {
    max-width: 720px;
    color: var(--archeon-muted);
    line-height: 1.75;
    margin-top: 13px;
    font-size: 15px;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 22px 0 15px;
}

.filter {
    border: 1px solid var(--archeon-gold-dark);
    background: #191811;
    color: var(--archeon-gold);
    padding: 11px 18px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .4px;
    transition: .2s ease;
}

.filter:hover,
.filter.active {
    background: var(--archeon-gold);
    color: #17140e;
    border-color: var(--archeon-gold);
}

.search {
    display: block;
    width: 100%;
    max-width: 440px;
    padding: 14px 17px;
    border: 1px solid var(--archeon-gold-dark);
    border-radius: 9px;
    outline: none;
    background: #1a1812;
    color: var(--archeon-text);
    font-size: 14px;
    margin-bottom: 18px;
}

.search::placeholder {
    color: #a69b85;
}

.search:focus {
    border-color: var(--archeon-gold);
    box-shadow: 0 0 0 3px rgba(233, 189, 104, .10);
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 650px;
    border: 1px solid var(--archeon-gold-dark);
    border-radius: 14px;
    overflow: hidden;
    background: #1a1812;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
}

#map {
    width: 100%;
    height: 100%;
    background: #d7d0c2;
}

.counter {
    position: absolute;
    z-index: 1000;
    top: 15px;
    right: 15px;
    background: #17150f;
    color: var(--archeon-gold);
    border: 1px solid var(--archeon-gold-dark);
    padding: 11px 15px;
    border-radius: 8px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, .22);
    font-size: 13px;
    font-weight: 700;
}

.legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 15px;
    font-size: 13px;
    color: var(--archeon-muted);
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(233, 189, 104, .12);
}

.stone-dot {
    background: #8b5a2b;
}

.bronze-dot {
    background: #c47a25;
}

.iron-dot {
    background: #333;
    border: 1px solid #d5c7a9;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
    background: #191811;
    color: var(--archeon-text);
}

.leaflet-popup-content-wrapper {
    border: 1px solid var(--archeon-gold-dark);
    border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
}

.leaflet-popup-content {
    margin: 0;
    width: 290px !important;
}

.leaflet-popup-close-button {
    color: var(--archeon-gold) !important;
}

.popup {
    overflow: hidden;
    background: #191811;
    border-radius: 12px;
}

.popup img {
    width: 100%;
    height: 145px;
    object-fit: cover;
    display: block;
    background: #252219;
}

.popup-body {
    padding: 15px;
}

.popup-title {
    color: var(--archeon-gold);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 10px;
}

.popup-row {
    margin: 6px 0;
    color: var(--archeon-text);
    font-size: 13px;
    line-height: 1.5;
}

.popup-row strong {
    color: var(--archeon-gold);
}

.popup-description {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--archeon-gold-dark);
    color: var(--archeon-muted);
    line-height: 1.6;
    font-size: 13px;
}

.marker {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid #f5e8c9;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
}

.custom-marker {
    background: transparent;
    border: none;
}

.leaflet-control-zoom a {
    background: #191811 !important;
    color: var(--archeon-gold) !important;
    border-color: var(--archeon-gold-dark) !important;
}

.leaflet-control-attribution {
    background: rgba(17, 17, 14, .85) !important;
    color: #c6c0b4 !important;
}

.leaflet-control-attribution a {
    color: #d4ad62 !important;
}

footer {
    margin-top: 42px;
    padding: 25px 0 0;
    border-top: 1px solid var(--archeon-gold-dark);
    color: #a9a092;
    font-size: 12px;
    text-align: center;
}

@media (max-width: 800px) {
    .header {
        padding: 0 20px;
    }

    .page {
        width: auto;
        margin: 0;
        padding: 30px 20px 40px;
    }

    .title-row {

    }

    .map-wrap {

    }

@media (max-width: 500px) {
    .logo {
        font-size: 20px;

    }

    .back {

    }

    .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
    }

    h1 {

    }

    .subtitle {
        font-size: 13px;
    }

    .map-wrap {
        height: 500px;

    }

    .filter {
        padding: 9px 13px;
        font-size: 11px;
    }

    .counter {
        top: 10px;
        right: 10px;
        padding: 9px 11px;
        font-size: 12px;
    }

    .leaflet-popup-content {
        width: 250px !important;
    }
}
</style>
</head>

/* =====================================================
   МАРКЕРЛЕР
===================================================== */

let markers = [];

function getColor(era){

    if(era === "stone"){
        return "#8b5a2b";
    }

    if(era === "bronze"){
        return "#c47a25";
    }

    return "#333";
}


function createMarker(site){

    const icon = L.divIcon({

        className:"custom-marker",

        html:
            `<div class="marker"
            style="background:${getColor(site.era)}"></div>`,

        iconSize:[18,18],

        iconAnchor:[9,9]

    });


    const marker = L.marker(
        [site.lat, site.lng],
        {icon:icon}
    );


    const popup = `

        <div class="popup">

            <img
                src="${site.image}"
                onerror="this.src='archeon.png'"
            >

            <div class="popup-body">

                <div class="popup-title">
                    ${site.name}
                </div>

                <div class="popup-row">
                    <strong>Дәуірі:</strong>
                    ${site.eraName}
                </div>

                <div class="popup-row">
                    <strong>Өңірі:</strong>
                    ${site.region}
                </div>

                <div class="popup-row">
                    <strong>Ескерткіш түрі:</strong>
                    ${site.type}
                </div>

                <div class="popup-description">
                    ${site.description}
                </div>

            </div>

        </div>

    `;

    marker.bindPopup(popup);

    marker.siteData = site;

    return marker;
}


/* =====================================================
   БАРЛЫҚ МАРКЕРЛЕРДІ ҚОСУ
===================================================== */

sites.forEach(site => {

    const marker = createMarker(site);

    markers.push(marker);

    marker.addTo(map);

});


/* =====================================================
   ФИЛЬТР
===================================================== */

let currentEra = "all";

const filterButtons =
    document.querySelectorAll(".filter");


filterButtons.forEach(button => {

    button.addEventListener("click", function(){

        filterButtons.forEach(btn =>
            btn.classList.remove("active")
        );

        this.classList.add("active");

        currentEra = this.dataset.era;

        updateMap();

    });

});


/* =====================================================
   ІЗДЕУ + ФИЛЬТР
===================================================== */

const searchInput =
    document.getElementById("search");


searchInput.addEventListener("input", updateMap);


function updateMap(){

    const query =
        searchInput.value
            .toLowerCase()
            .trim();


    let visibleCount = 0;


    markers.forEach(marker => {

        const site = marker.siteData;


        const eraMatch =
            currentEra === "all" ||
            site.era === currentEra;


        const text =
            (
                site.name +
                " " +
                site.region +
                " " +
                site.type
            ).toLowerCase();


        const searchMatch =
            text.includes(query);


        if(eraMatch && searchMatch){

            if(!map.hasLayer(marker)){
                marker.addTo(map);
            }

            visibleCount++;

        }else{

            if(map.hasLayer(marker)){
                map.removeLayer(marker);
            }

        }

    });


    document.getElementById("counter").textContent =
        visibleCount + " нысан";

}


/* =====================================================
   ESC — POPUP ЖАБУ
===================================================== */

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){
        map.closePopup();
    }

});
